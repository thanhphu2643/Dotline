[package]
name = "dotline_core"
version = "0.2.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tiny_http = "0.12.0"

[dev-dependencies]
tempfile = "3.27.0"

[lib]
crate-type = ["staticlib", "rlib"]

[profile.release]
lto = true
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_Security"] }
