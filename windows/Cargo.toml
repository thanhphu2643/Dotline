[package]
name = "dotline-windows"
version = "0.2.0"
edition = "2024"
description = "Dotline for Windows: tray app that prints raw labels sent by web apps"

[[bin]]
name = "Dotline"
path = "src/main.rs"

[dependencies]
dotline_core = { path = "../core" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
tao = "0.34"
arboard = "3"
png = "0.18"
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Globalization"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
strip = true
opt-level = "s"
